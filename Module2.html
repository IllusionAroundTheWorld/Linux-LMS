        gap: 8px;
        overflow-x: auto;
        padding-bottom: 12px;
        margin-bottom: 20px;
        scrollbar-width: thin;

      .tab {
        background: #ffffff;
        border: 1px solid var(--line);
        color: var(--navy);
        border-radius: 10px;
        padding: 8px 14px;
        font-weight: 700;
        font-size: 13.5px;
        cursor: pointer;
        white-space: nowrap;
        flex: none;

      .tab:hover {
        border-color: var(--tint-bd);
        background: var(--tint);
      }
      .tab.on {
        background: var(--blue);
        border-color: var(--blue);

      }
      .tab.done {
        border-color: var(--ok);
        color: var(--ok);
      }
      .tab.done.on {
        background: var(--ok);
        border-color: var(--ok);
        color: #ffffff;

        border-radius: 14px;
        padding: 20px 24px;
        background: #ffffff;
        box-shadow: 0 2px 8px rgba(23, 32, 44, 0.03);

      .btn {
        background: var(--blue);
        color: #ffffff;
        border: 0;
        border-radius: 10px;
        padding: 10px 18px;
        font-weight: 700;
        font-size: 14px;

        background: var(--tint);

      .chip.on {
        background: var(--blue);
        border-color: var(--blue);

      .chip.ok {
        background: var(--ok-bg);
        border-color: var(--ok);
        color: var(--ok);

        border-radius: 10px;
        padding: 14px 18px;
        min-height: 48px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        margin-bottom: 24px;
      }
      .detail p {
        margin: 0;
        font-size: 14px;
        line-height: 1.5;
        color: var(--navy);
      }

      /* Flowchart Canvas */
      .chart-card {
        background: #ffffff;
        border: 1.5px solid var(--tint-bd);
        border-radius: 12px;
        padding: 14px 16px;
        margin-top: 10px;
        margin-bottom: 24px;
        box-shadow: 0 1px 4px rgba(23, 32, 44, 0.02);
      }
      .svg-flowchart {
        width: 100%;
        height: auto;
        display: block;
        overflow: visible;
      }
      .node-rect {
        rx: 7px;
        ry: 7px;
        stroke-width: 1.75px;
        transition: all 0.22s ease;
      }
      .flow-line {
        stroke-width: 2px;
        stroke-linecap: round;
        transition: all 0.22s ease;
      }
      .node-text {
        font-family: var(--font-sans);
        font-size: 11px;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: central;
        pointer-events: none;
      }
      .node-left {
        font-family: var(--font-mono);
        font-size: 9.5px;
        font-weight: 600;
        text-anchor: start !important;
        dominant-baseline: central;
        pointer-events: none;
      }
      .node-mono {
        font-family: var(--font-mono);
        font-size: 10px;
        font-weight: 600;
        text-anchor: middle;
        dominant-baseline: central;
        pointer-events: none;
      }
      .st-active {
        fill: var(--tint);
        stroke: var(--blue);
      }
      .st-active text {
        fill: var(--blue-d);
      }
      .st-pass {
        fill: var(--ok-bg);
        stroke: var(--ok);
        filter: drop-shadow(0 1px 3px rgba(13, 138, 85, 0.12));
      }
      .st-pass text {
        fill: var(--ok);
      }
      .line-blue {
        stroke: var(--blue);
      }
      .line-pass {
        stroke: var(--ok);
      }

    <script>
      const $ = (id) => document.getElementById(id);
      const esc = (s) => (s ? String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;") : "");

      /* Module 2 Levels Definition */
      const LEVELS = [
        {
          id: 1,
          title: "1. Shell & Terminal Basics",
          desc: "Master the Bash terminal shell environment, command grammar, flags, and critical environment variables.",
          facts: [
            [
              "What is a Shell?",
              "The command interpreter program that translates user keyboard input into privileged kernel system instructions.",
            ],
            [
              "Terminal vs Shell",
              "A terminal window accepts keyboard input, while the shell interprets commands and launches system programs.",
            ],
            [
              "Environment Variables",
              "Variables like PATH and HOME store system configurations accessible to all running shell child processes.",
            ],
            [
              "Command Anatomy",
              "Linux commands consist of an executable name, option flags modifying behavior, and target arguments.",
            ],
          ],
          code: {
            title: "Bash: Inspect Shell Environment & Active Variables",
            src: `echo "Active Shell : $SHELL"\necho "User Home    : $HOME"\necho "Binary Path  : $PATH | cut -d: -f1-3`,
            out: `Active Shell : /bin/bash\nUser Home    : /home/student\nBinary Path  : /usr/local/sbin:/usr/local/bin:/usr/sbin`,
          },
          task: "Explore shell environment variables and command syntax flags.",
          simSteps: [
            {
              h: "Query Active Shell",
              p: "Inspect which shell interpreter is assigned to the current session using the $SHELL environment variable.",
              b: "Run echo $SHELL",
              res: "/bin/bash (GNU Bourne-Again SHell).",
            },
            {
              h: "Inspect Binary Search Path",
              p: "View the ordered directory list Linux scans when executing commands using the $PATH variable.",
              b: "Run echo $PATH",
              res: "/usr/local/bin:/usr/bin:/bin:/usr/games (Standard search locations).",
            },
            {
              h: "Execute Flagged Command",
              p: "Run a command with combined short options and a human-readable argument flag.",
              b: "Run ls -lah",
              res: "total 32K (Permissions, user ownership, sizes in KB/MB, and timestamp metadata).",
            },
          ],
        },
        {
          id: 2,
          title: "2. File System Hierarchy (FHS)",
          desc: "Explore standard Linux directory architecture from the root directory down to system configuration and variable data.",
          facts: [
            [
              "Root Directory (/)",
              "The single top-level directory where all storage devices and nested subdirectories attach in Linux.",
            ],
            [
              "FHS Standard",
              "The Filesystem Hierarchy Standard defines consistent directory locations across every standard Linux distribution.",
            ],
            [
              "Configuration (/etc)",
              "Stores host-specific system configuration files, startup scripts, network configurations, and installed daemon settings.",
            ],
            [
              "Variable Data (/var)",
              "Houses dynamic system runtime data including web logs, mail spools, caches, and database files.",
            ],
            [
              "Virtual Files (/proc & /sys)",
              "Memory-resident pseudofiles exposing real-time kernel metrics, hardware diagnostics, and live process states.",
            ],
          ],
          code: {
            title: "Bash: Inspect FHS Tree & Live Kernel Pseudo-files",
            src: `ls -d /* | head -n 6\ncat /proc/sys/kernel/osrelease\nhead -n 2 /etc/os-release`,
            out: `/bin  /boot  /dev  /etc  /home  /lib\n6.8.0-45-generic\nPRETTY_NAME="Ubuntu 24.04 LTS"\nNAME="Ubuntu"`,
          },
          task: "Audit standard FHS directories and inspect live kernel runtime files under /proc.",
          simSteps: [
            {
              h: "Audit Root Directory",
              p: "List primary root level folders to verify strict Filesystem Hierarchy Standard compliance.",
              b: "Run ls -ld /",
              res: "drwxr-xr-x 19 root root 4096 (Single unified root mount point).",
            },
            {
              h: "Read Kernel Release in /proc",
              p: "Query live memory metrics directly from the kernel virtual filesystem.",
              b: "Run cat /proc/version",
              res: "Linux version 6.8.0-generic (gcc version 13.2.0, SMP PREEMPT_DYNAMIC).",
            },
            {
              h: "Check System Config in /etc",
              p: "View host-specific identity configuration stored in the standard /etc directory.",
              b: "Run cat /etc/hostname",
              res: "ist-linux-srv01 (Production server network identifier).",
            },
          ],
        },
        {
          id: 3,
          title: "3. Navigation Commands",
          desc: "Navigate through directory trees rapidly using pwd, cd, ls flags, and absolute versus relative path notation.",
          facts: [
            [
              "Working Directory (pwd)",
              "Displays the complete absolute directory path of the current shell location within storage.",
            ],
            [
              "Changing Directory (cd)",
              "Moves the shell session into specified directories using absolute paths or relative shortcuts.",
            ],
            [
              "Directory Listing (ls)",
              "Lists directory contents, displaying hidden dotfiles, file permissions, owners, sizes, and timestamps.",
            ],
            [
              "Absolute vs Relative Paths",
              "Absolute paths start from root (/), while relative paths calculate locations from current working directory.",
            ],
            [
              "Path Shortcuts (~, ., ..)",
              "Tilde represents home, single dot represents current directory, and double dot represents parent directory.",
            ],
          ],
          code: {
            title: "Bash: Directory Navigation & Path Resolution",
            src: `pwd\ncd /var/log && pwd\ncd ../mail && pwd\ncd ~ && pwd`,
            out: `/home/student\n/var/log\n/var/mail\n/home/student`,
          },
          task: "Traverse filesystem hierarchies using relative shortcuts and detailed directory listing options.",
          simSteps: [
            {
              h: "Print Working Directory",
              p: "Verify the shell's current active directory location before executing file modifications.",
              b: "Run pwd",
              res: "/home/student/projects (Current active workspace location).",
            },
            {
              h: "Relative Parent Navigation",
              p: "Step up one directory level into the parent folder using the double-dot shortcut.",
              b: "Run cd .. && pwd",
              res: "/home/student (Parent directory reached via relative path).",
            },
            {
              h: "Return to Home Directory",
              p: "Jump directly back to the user personal home folder using the tilde shortcut.",
              b: "Run cd ~ && pwd",
              res: "/home/student (Home anchor point verified).",
            },
          ],
        },
        {
          id: 4,
          title: "4. File & Directory Management",
          desc: "Create, copy, move, rename, delete, and search for files and directories across Linux storage.",
          facts: [
            [
              "Creating Files (touch)",
              "Creates empty files or updates existing file access and modification timestamps without altering content.",
            ],
            [
              "Creating Directories (mkdir)",
              "Creates new directory folders with parent creation support using the recursive -p flag.",
            ],
            [
              "Copying Files (cp)",
              "Duplicates files or entire directory trees into new locations while optionally preserving metadata.",
            ],
            [
              "Moving & Renaming (mv)",
              "Relocates files across directories or renames files without duplicating underlying storage blocks.",
            ],
            [
              "Finding Files (find)",
              "Searches filesystem trees in real time by filename, size, modification date, and permissions.",
            ],
          ],
          code: {
            title: "Bash: Create Project Hierarchy & Locate Files",
            src: `mkdir -p /tmp/app/{src,bin,logs}\ntouch /tmp/app/src/main.py\nfind /tmp/app -name "*.py"`,
            out: `/tmp/app/src/main.py (File matched and verified)`,
          },
          task: "Organize a multi-tier enterprise project directory hierarchy using batch CLI operations.",
          simSteps: [
            {
              h: "Batch Create Nested Folders",
              p: "Create a complete multi-tier directory structure in a single command using brace expansion.",
              b: "Run mkdir -p",
              res: "Created: /tmp/company_app/{conf,data,logs,bin}.",
            },
            {
              h: "Generate Configuration File",
              p: "Create a new application settings template using touch.",
              b: "Run touch",
              res: "Created: /tmp/company_app/conf/app.cfg (0 bytes, timestamp updated).",
            },
            {
              h: "Find Configuration Files",
              p: "Locate all .cfg files recursively inside the application directory tree.",
              b: "Run find",
              res: "/tmp/company_app/conf/app.cfg (Search match returned).",
            },
          ],
        },
        {
          id: 5,
          title: "5. Viewing & Editing Files",
          desc: "Inspect file contents using cat, less, and tail -f, and master modal editing with vi/vim and nano.",
          facts: [
            [
              "Viewing Content (cat & less)",
              "Cat outputs entire files immediately, while less enables keyboard scrolling through large logs.",
            ],
            [
              "Slicing Files (head & tail)",
              "Head reads opening lines, while tail -f continuously streams live incoming server log entries.",
            ],
            [
              "Simple Editing (nano)",
              "User-friendly terminal text editor displaying keyboard shortcuts directly along the bottom screen bar.",
            ],
            [
              "Modal Editing (vi/vim)",
              "Powerful terminal text editor operating across distinct Normal, Insert, and Command modes.",
            ],
            [
              "Vim Mode Switching",
              "Press i to type text in Insert mode, and Escape to return to Normal mode.",
            ],
          ],
          code: {
            title: "Bash: Slice Log Files & Inspect Lines",
            src: `head -n 3 /etc/passwd\ntail -n 3 /etc/passwd\nwc -l /etc/passwd`,
            out: `root:x:0:0:root:/root:/bin/bash\ndaemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin\nbin:x:2:2:bin:/bin:/usr/sbin/nologin\n...\n48 /etc/passwd (Total Lines)`,
          },
          task: "Inspect system log files and practice Vim modal editing workflow commands.",
          simSteps: [
            {
              h: "Inspect Opening Header Lines",
              p: "Read the top 3 lines of the system password database without loading the whole file.",
              b: "Run head -n 3",
              res: "root:x:0:0:root:/root:/bin/bash (Header records inspected).",
            },
            {
              h: "Inspect Recent Log Tail",
              p: "Read the final 3 lines of system authentication logs to verify recent logins.",
              b: "Run tail -n 3",
              res: "session opened for user student by (uid=0) (Auth log verified).",
            },
            {
              h: "Save and Exit in Vim",
              p: "Execute the command-mode sequence to write buffer changes and quit vim safely.",
              b: "Run :wq in Vim",
              res: "File saved: 42 lines, 1420 bytes written to disk.",
            },
          ],
        },
        {
          id: 6,
          title: "6. Wildcards, Redirection & Pipes",
          desc: "Channel standard input, output, and error streams, and connect commands with pipelines and tee.",
          facts: [
            [
              "Shell Wildcards (Globbing)",
              "Asterisk matches any characters, question mark matches single characters, and brackets match character ranges.",
            ],
            [
              "Standard Streams (0, 1, 2)",
              "Linux processes communicate using standard input (0), standard output (1), and standard error (2).",
            ],
            [
              "Output Redirection (>)",
              "Redirects command output into files, overwriting with single arrow or appending with double arrow.",
            ],
            [
              "Command Pipelines (|)",
              "Channels stdout of first command directly into stdin of second command in memory.",
            ],
            [
              "Splitting Streams (tee)",
              "Tee copies stream output to terminal display while simultaneously writing to disk files.",
            ],
          ],
          code: {
            title: "Bash: Multi-stage Pipe & Output Redirection",
            src: `cat /etc/passwd | cut -d: -f1,7 | grep "bash" | tee /tmp/bash_users.txt`,
            out: `root:/bin/bash\nstudent:/bin/bash\nadmin:/bin/bash\n(Written to screen AND /tmp/bash_users.txt)`,
          },
          task: "Build a multi-stage CLI log-filtering pipeline using redirection, pipes, and tee.",
          simSteps: [
            {
              h: "Filter Stream with Pipe",
              p: "Pipe user accounts into grep to isolate active interactive bash logins.",
              b: "Run cat | grep",
              res: "root, student, admin (Filtered interactive shell users).",
            },
            {
              h: "Redirect Standard Output",
              p: "Write filtered user list into a permanent text report using redirection (>).",
              b: "Run > report.txt",
              res: "Output redirected to report.txt (File written with zero terminal output).",
            },
            {
              h: "Separate Error Streams",
              p: "Send standard errors to a separate log file using 2> file descriptor syntax.",
              b: "Run 2> error.log",
              res: "Errors routed to error.log while clean output remains on standard display.",
            },
          ],
        },
        {
          id: 7,
          title: "7. Hard Links & Soft Links",
          desc: "Understand filesystem inodes, data block pointers, and the behavioral differences between hard and soft links.",
          facts: [
            [
              "Inodes & Data Blocks",
              "An inode stores file metadata, permissions, and storage block pointers, excluding the filename.",
            ],
            [
              "Hard Links (ln)",
              "Creates another directory entry pointing directly to the identical inode number on storage.",
            ],
            [
              "Hard Link Deletion",
              "Deleting one hard link retains file data until all link reference counters reach zero.",
            ],
            [
              "Soft Links (ln -s)",
              "Creates pointer files storing the string path to target files across any filesystem.",
            ],
            [
              "Broken Symlinks",
              "Moving or deleting original target files renders symbolic links broken and unreadable until repaired.",
            ],
          ],
          code: {
            title: "Bash: Inode Inspection & Link Creation",
            src: `echo "data" > original.txt\nln original.txt hard.txt\nln -s original.txt soft.txt\nls -li original.txt hard.txt soft.txt`,
            out: `412033 -rw-r--r-- 2 student student 5 Nov 19 12:00 hard.txt\n412033 -rw-r--r-- 2 student student 5 Nov 19 12:00 original.txt\n589211 lrwxrwxrwx 1 student student 12 Nov 19 12:00 soft.txt -> original.txt`,
          },
          task: "Demonstrate inode sharing with hard links and cross-filesystem symlinks.",
          simSteps: [
            {
              h: "Inspect File Inode Number",
              p: "Query the low-level filesystem index node number assigned to the sample file.",
              b: "Run ls -i",
              res: "Inode 412033 assigned to original.txt.",
            },
            {
              h: "Create Hard Link",
              p: "Create a hard link and observe link count increase to 2 with identical inode.",

              res: "Both files share Inode 412033. Link count = 2.",

              h: "Create Symbolic Link",
              p: "Create a soft pointer link with independent inode pointing to the filename path.",

        },
        {
          id: 8,
          title: "8. Help System (man & info)",
          desc: "Master built-in documentation, manual page sections (1–8), apropos search, and command --help flags.",
          facts: [

        chips.forEach((c, i) => c.classList.toggle("on", i === modeIdx));
        $("fc_chart_wrap").innerHTML = fc.views[modeIdx];
        $("fc_explain").innerHTML = `<p style="margin:0;font-size:13.5px;color:var(--navy);line-height:1.5;">${esc(fc.explains[modeIdx])}</p>`;
      }

      /* Chips Picker */
      function pickChip(i) {
        const l = LEVELS[currentTab];
        if (!l) return;
        const items = $("chips").children;
        for (let k = 0; k < items.length; k++)
          items[k].classList.toggle("on", k === i);
        const it = l.facts[i];
        $("chipDetail").innerHTML =
          `<p><b style="color:var(--navy);font-size:14px;">${esc(it[0])}</b></p><p style="margin-top:3px;font-size:13.5px;">${esc(it[1])}</p>`;
      }

      /* Step through hands-on simulator */
      function updateSimStepView() {
        const l = LEVELS[currentTab];
        if (!l) return;
        const s = l.simSteps[simStep];
        $("sim_step_title").textContent = s.h;
        $("sim_step_num").textContent = `Step ${simStep + 1} of ${l.simSteps.length}`;
        $("sim_step_desc").textContent = s.p;
        $("sim_run_btn").textContent = s.b;
        $("sim_prev_btn").disabled = simStep === 0;
        $("sim_next_btn").disabled = simStep === l.simSteps.length - 1;
        const resWrap = $("sim_result_wrap");
        resWrap.style.display = "none";
        resWrap.textContent = "";
      }

      /* Generate Complete Course Notes Plain Text (.txt) */
      function generateSummaryText() {
        let txt = "================================================================================\n";
        txt += "INOVATE SOLUTION TECHNOLOGY — COURSE MODULE NOTES\n";
        txt += "MODULE 2: LINUX COMMAND LINE & FILE SYSTEM HIERARCHY\n";
        txt += "================================================================================\n\n";

        LEVELS.forEach((l, idx) => {
          txt += `LEVEL ${idx + 1}: ${l.title.toUpperCase()}\n`;
          txt += "--------------------------------------------------------------------------------\n";
          txt += `Overview: ${l.desc}\n\n`;
          txt += "Key Technical Concepts & Student Takeaways:\n";
          l.facts.forEach(f => {
            txt += `  • ${f[0]}: ${f[1]}\n`;
          });
          txt += "\nExample Practical Command Execution:\n";
          txt += `  Command: ${l.code.src.replace(/\n/g, " ; ")}\n`;
          txt += `  Output : ${l.code.out.replace(/\n/g, " | ")}\n`;
          txt += "\n\n";
        });

        txt += "================================================================================\n";
        txt += "Official Website: https://www.inovatesolutiontechnology.in/\n";
        txt += "Inovate Solution Technology — Empowering Real-world Engineering Mastery\n";
        txt += "================================================================================\n";
        return txt;
      }

      /* Trigger Browser Download for .txt file */
      function downloadCourseSummaryTxt() {
        const textContent = generateSummaryText();
        const blob = new Blob([textContent], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "Linux_Module2_Course_Summary.txt";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      /* Centralized Event Handler */
      document.addEventListener("click", (e) => {
        const t = e.target.closest("[data-a]");
        if (!t) return;
        const a = t.dataset.a;
        const i = +t.dataset.i;

        if (a === "tab") {
          renderActiveTab(i);
          window.scrollTo({ top: 0, behavior: "smooth" });
        } else if (a === "chip") {
          pickChip(i);
        } else if (a === "fcMode") {
          switchFlowchartMode(+t.dataset.m);
        } else if (a === "runSim") {
          const l = LEVELS[currentTab];
          if (!l) return;
          const s = l.simSteps[simStep];
          const resWrap = $("sim_result_wrap");
          resWrap.textContent = s.res;
          resWrap.style.display = "block";
        } else if (a === "simPrev") {
          if (simStep > 0) {
            simStep--;
            updateSimStepView();
          }
        } else if (a === "simNext") {
          const l = LEVELS[currentTab];
          if (l && simStep < l.simSteps.length - 1) {
            simStep++;
            updateSimStepView();
          }
        } else if (a === "dlTxt") {
          downloadCourseSummaryTxt();
        }
      });

      /* Initialize Level 1 */
      renderActiveTab(0);
    </script>
  </body>
</html>
