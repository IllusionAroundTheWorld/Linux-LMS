<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Module 1: Linux Administration &amp; Fundamentals | IST Learn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #17202c;
        --blue: #1571ba;
        --blue-d: #105c98;
        --mut: #5d6470;
        --line: #dfe3e8;
        --tint: #eef6fc;
        --tint-bd: #c5d6f0;
        --panel: #f7f8fa;
        --ok: #0d8a55;
        --ok-bg: #e6f4ec;
        --warn: #b7791f;
        --warn-bg: #fef3c7;
        --bad: #c0392b;
        --bad-bg: #fbeceb;
        --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #fbfcfd;
        color: var(--navy);
        font-family:
          "Plus Jakarta Sans",
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        line-height: 1.6;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      /* Top Header */
      .top-nav {
        background: #ffffff;
        border-bottom: 1px solid var(--line);
        padding: 10px 24px;
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .top-nav-inner {
        max-width: 1040px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .brand-link {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
      }
      .top-pill {
        font-size: 11.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .06em;
        color: var(--blue);
        background: var(--tint);
        border: 1px solid var(--tint-bd);
        padding: 4px 12px;
        border-radius: 999px;
      }

      main {
        max-width: 1040px;
        margin: 0 auto;
        padding: 28px 20px 60px;
      }
      h1 {
        font-size: clamp(24px, 4vw, 32px);
        line-height: 1.25;
        letter-spacing: -0.02em;
        font-weight: 800;
        margin: 0 0 16px;
        color: var(--navy);
      }
      h2 {
        font-size: 22px;
        letter-spacing: -0.015em;
        font-weight: 800;
        margin: 0 0 6px;
      }
      h3 {
        font-size: 16px;
        font-weight: 800;
        margin: 28px 0 10px;
      }
      p {
        margin: 0 0 10px;
      }
      .sm {
        color: var(--mut);
        font-size: 13px;
        line-height: 1.5;
      }
      .hint {
        color: var(--mut);
        font-size: 14.5px;
        margin: 0 0 16px;
        line-height: 1.5;
      }
      button {
        font-family: inherit;
        color: inherit;
      }
      button:focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 2px;
      }



      /* Level Navigation Tabs (Horizontal Scrollable Bar) */
      .nav-scroll {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 12px;
        margin-bottom: 20px;
        scrollbar-width: thin;
      }
      .tab {
        background: #ffffff;
        border: 1px solid var(--line);
        color: var(--navy);
        border-radius: 10px;
        padding: 8px 14px;
        font-weight: 700;
        font-size: 13.5px;
        cursor: pointer;
        white-space: nowrap;
        flex: none;
        transition: all 0.15s ease;
      }
      .tab:hover {
        border-color: var(--tint-bd);
        background: var(--tint);
      }
      .tab.on {
        background: var(--blue);
        border-color: var(--blue);
        color: #ffffff;
      }
      .tab.done {
        border-color: var(--ok);
        color: var(--ok);
      }
      .tab.done.on {
        background: var(--ok);
        border-color: var(--ok);
        color: #ffffff;
      }

      .card {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 20px 24px;
        background: #ffffff;
        box-shadow: 0 2px 8px rgba(23, 32, 44, 0.03);
      }
      .btn {
        background: var(--blue);
        color: #ffffff;
        border: 0;
        border-radius: 10px;
        padding: 10px 18px;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .btn:hover {
        background: var(--blue-d);
      }
      .btn.alt {
        background: var(--tint);
        color: var(--blue);
        border: 1px solid var(--tint-bd);
      }
      .btn.alt:hover {
        background: #deedfb;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: default;
      }

      pre {
        background: var(--navy);
        color: #e8f0ff;
        border-radius: 10px;
        padding: 12px 16px;
        font: 12.5px/1.6 var(--font-mono);
        margin: 8px 0;
        overflow-x: auto;
        white-space: pre-wrap;
      }

      .lab {
        font-weight: 800;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: .04em;
        color: var(--mut);
        margin: 0 0 4px;
        display: block;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 8px 0 12px;
      }
      .chip {
        background: #ffffff;
        border: 1px solid var(--tint-bd);
        color: var(--navy);
        border-radius: 999px;
        padding: 7px 15px;
        font-weight: 600;
        font-size: 13.5px;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .chip:hover {
        background: var(--tint);
      }
      .chip.on {
        background: var(--blue);
        border-color: var(--blue);
        color: #ffffff;
      }

      .detail {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 18px;
        margin-top: 10px;
        min-height: 56px;
        line-height: 1.5;
      }
      .detail p:last-child {
        margin-bottom: 0;
      }

      /* Walkthrough Simulator */
      .track {
        height: 8px;
        background: var(--line);
        border-radius: 99px;
        overflow: hidden;
        margin: 8px 0 6px;
      }
      .fill {
        height: 100%;
        background: var(--blue);
        transition: width 0.25s ease;
      }
      .dots {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 14px 0 16px;
      }
      .dot {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 2px solid var(--line);
        background: #ffffff;
        font-weight: 800;
        font-size: 13px;
        cursor: pointer;
        color: var(--mut);
        transition: all 0.15s ease;
      }
      .dot.on {
        border-color: var(--blue);
        background: var(--blue);
        color: #ffffff;
      }
      .dot.done {
        border-color: var(--ok);
        color: var(--ok);
      }
      .dot.on.done {
        background: var(--ok);
        color: #ffffff;
      }

      .win {
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
        background: #ffffff;
        font-size: 13.5px;
        box-shadow: 0 1px 4px rgba(23, 32, 44, 0.02);
      }
      .tb {
        background: #eef2f7;
        padding: 8px 14px;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--mut);
        font-weight: 600;
      }
      .tb .d {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #c3cbd8;
        display: inline-block;
      }
      .tb b {
        margin-left: 8px;
        font-weight: 600;
        color: var(--navy);
      }
      .pg {
        padding: 22px 20px 26px;
        text-align: center;
      }
      .pg h4 {
        margin: 0 0 6px;
        font-size: 17px;
        color: var(--navy);
      }
      .pg p {
        color: var(--mut);
        font-size: 13.5px;
        margin-bottom: 16px;
        line-height: 1.5;
      }
      .fake {
        display: inline-block;
        background: var(--blue);
        color: #ffffff;
        font-weight: 700;
        border: 0;
        border-radius: 8px;
        padding: 8px 18px;
        font-size: 13.5px;
      }
      .fake.off {
        background: #d5dbe6;
        color: #5a6a80;
      }
      .tg {
        cursor: pointer;
        outline: 2px dashed var(--blue);
        outline-offset: 3px;
        transition: background 0.15s ease;
      }
      .tg:hover {
        background-color: var(--blue-d);
      }
      .status {
        font-weight: 700;
        font-size: 13.5px;
        margin: 12px 0 0;
        color: var(--mut);
      }
      .status.ok {
        color: var(--ok);
      }

      /* Video Card */
      .video-card {
        border: 1px solid var(--tint-bd);
        border-radius: 14px;
        padding: 18px 22px;
        background: #ffffff;
        margin-bottom: 24px;
        box-shadow: 0 2px 8px rgba(23, 32, 44, 0.03);
      }
      .video-embed-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 10px;
        overflow: hidden;
        background: #000000;
        margin: 12px 0 14px;
      }
      .video-embed-wrap iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }

      /* Checklist */
      .ckb {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        text-align: left;
        background: #ffffff;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 16px;
        margin-bottom: 8px;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .ckb:hover {
        border-color: var(--tint-bd);
      }
      .ckb.on {
        background: var(--tint);
        border-color: var(--tint-bd);
      }
      .cb {
        width: 18px;
        height: 18px;
        border: 2px solid var(--blue);
        border-radius: 4px;
        display: inline-block;
        flex: none;
        position: relative;
        transition: background 0.15s ease;
      }
      .cb.on {
        background: var(--blue);
      }
      .cb.on::after {
        content: "";
        position: absolute;
        left: 4px;
        top: 1px;
        width: 5px;
        height: 9px;
        border: solid #ffffff;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
      }

      /* Quiz */
      .q {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 12px;
        background: #ffffff;
      }
      .opt {
        display: block;
        width: 100%;
        text-align: left;
        background: #ffffff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 14px;
        margin: 8px 0;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .opt:hover {
        border-color: var(--blue);
        background: var(--tint);
      }
      .opt.ok {
        border-color: var(--ok);
        background: var(--ok-bg);
        color: var(--ok);
      }
      .opt.bad {
        border-color: var(--bad);
        background: var(--bad-bg);
        color: var(--bad);
      }
      .fb {
        margin: 6px 0 0;
        font-weight: 600;
        font-size: 13px;
      }
      .msg {
        font-weight: 700;
        margin: 14px 0 8px;
      }

      /* SVG Flowchart Styles */
      .chart-card {
        background: #ffffff;
        border: 1.5px solid var(--tint-bd);
        border-radius: 12px;
        padding: 14px 16px;
        margin-top: 10px;
        margin-bottom: 24px;
        box-shadow: 0 1px 4px rgba(23, 32, 44, 0.02);
      }
      .svg-flowchart {
        width: 100%;
        height: auto;
        display: block;
        overflow: visible;
      }
      .node-rect {
        rx: 7px;
        ry: 7px;
        stroke-width: 1.75px;
        transition: all 0.22s ease;
      }
      .flow-line {
        stroke-width: 2px;
        stroke-linecap: round;
        transition: all 0.22s ease;
      }
      .node-text {
        font-family: var(--font-sans);
        font-size: 11px;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: central;
        pointer-events: none;
      }
      .node-left {
        font-family: var(--font-mono);
        font-size: 9.5px;
        font-weight: 600;
        text-anchor: start !important;
        dominant-baseline: central;
        pointer-events: none;
      }
      .node-mono {
        font-family: var(--font-mono);
        font-size: 10px;
        font-weight: 600;
        text-anchor: middle;
        dominant-baseline: central;
        pointer-events: none;
      }
      .branch-label {
        font-family: var(--font-mono);
        font-size: 9px;
        font-weight: 700;
        text-anchor: middle;
      }
      .st-active {
        fill: var(--tint);
        stroke: var(--blue);
      }
      .st-active text {
        fill: var(--blue-d);
      }
      .st-pass {
        fill: var(--ok-bg);
        stroke: var(--ok);
        filter: drop-shadow(0 1px 3px rgba(13, 138, 85, 0.12));
      }
      .st-pass text {
        fill: var(--ok);
      }
      .line-blue {
        stroke: var(--blue);
      }
      .line-pass {
        stroke: var(--ok);
      }

    </style>
  </head>

    <header class="top-nav">
      <div class="top-nav-inner">
        <a href="Module1.html" class="brand-link">

    <main>
      <h1>Linux Administration &amp; Fundamentals</h1>

    <script>
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");

      /* 8 Structured Levels Data for Module 1 */
      const LEVELS = [
        {
          id: 1,
          title: "1. Introduction & History of Linux",
          desc: "Why Linux was created, how open-source software works, and why Linux powers the modern world.",
          facts: [
            [
              "The 1991 Problem",

            [
              "Linus Torvalds' Idea",

            [

          ],

          simSteps: [

            {

              b: "Link GNU Utilities",
              res: "Milestone: Complete GNU/Linux operating system stack assembled for developers worldwide.",
            },
            {
              h: "Open Source vs Proprietary",
              p: "Linux source code is 100% open under GNU GPL, whereas proprietary systems lock users with closed binaries and fees.",
              b: "Compare Software Models",
              res: "Comparison Verified: Open Source guarantees full code transparency, free modification, and zero license costs.",
            },
          ],
          video: null,
          check: [
            "Linus Torvalds published the original Linux kernel version 0.01 in 1991",
            "The GNU GPL license guarantees software remains permanently free for modification",
            "Open source software guarantees public code auditability and community-driven freedom",
          ],
          quiz: [
            [
              "Who created the initial Linux kernel in 1991, and where?",
              [
                "Linus Torvalds at University of Helsinki",

              0,

            [
              "Which open-source license ensures Linux source code remains permanently free?",
              [
                "GNU General Public License (GPL)",
                "Apple Proprietary EULA",
                "Microsoft Shared Source",
              ],
              0,
            ],
            [
              "What is a primary distinction of open-source software compared to proprietary software?",
              [
                "Complete freedom to inspect, modify, and redistribute source code",
                "Prohibition against viewing or altering compiled code",
                "Mandatory recurring commercial license royalties",
              ],
              0,
            ],
          ],
        },
        {
          id: 2,
          title: "2. Linux Distributions & Evolution",
          desc: "How the open-source kernel blossomed into hundreds of specialized distributions for desktops, servers, and devices.",
          facts: [
            [
              "What is a Distro?",
              "A distribution packages the Linux kernel with software, compilers, desktop environments, and easy installation management systems.",
            ],
            [
              "Why Distro?",
              "The kernel alone cannot run programs without bundled tools, system libraries, package managers, and desktops.",
            ],
            [
              "4-Layer Architecture",
              "Linux cleanly separates user applications from physical hardware across four distinct, coordinated concentric tiers.",
            ],
            [
              "Debian Lineage (Ubuntu)",
              "Debian prioritizes software stability, while its popular derivative Ubuntu makes Linux accessible and friendly for beginners.",
            ],
            [

            [

          ],
          code: {
            title: "Bash: Query Package Management System",
            src: `# Debian/Ubuntu\napt list --installed | head -n 4\n\n# Red Hat/Fedora\n# dnf list installed | head -n 4`,

          task: "Compare Debian, Red Hat, and Arch package management workflows in the visual simulator.",
          simSteps: [
            {

            {

        },
        {
          id: 3,
          title: "3. Linux Architecture, Kernel Spaces & System Calls",
          desc: "Hardware protection rings, memory space separation (Ring 0 vs Ring 3), and the system call interface bridge.",
          facts: [
            [
              "Kernel Space (Ring 0)",
              "Ring 0 runs the privileged kernel with unrestricted access to physical memory, devices, and CPU execution.",
            ],
            [
              "User Space (Ring 3)",
              "Ring 3 executes user programs, shells, and daemons with restricted memory protection to prevent system crashes.",
            ],
            [
              "System Call Bridge",
              "User software cannot touch hardware directly, requesting actions via controlled system calls like read() and write().",
            ],
            [
              "Virtual File System (VFS)",

            [

          task: "Step through an application executing a system call to read hardware storage.",
          simSteps: [
            {
              h: "User Space Request",
              p: "A text editor in Ring 3 requests to open and read a file stored on the NVMe drive.",
              b: "Execute open() Syscall",
              res: "CPU switches to Ring 0: Syscall vector 257 (openat) intercepted by kernel.",
            },
            {
              h: "Kernel Verification & VFS",

      /* 2. Render Summary & Download View (Tab 9) */
      function renderSummaryView() {
        const c = $("levelContent");
        c.innerHTML = `
          <h2>9. Module 1 Course Summary &amp; Notes Export</h2>
          <p class="hint">Consolidated review of core concepts, architecture layers, commands, and video guides across all 8 levels.</p>

          <!-- Download Action Card -->
          <div class="card" style="margin-bottom:28px;border:1.5px solid var(--tint-bd);background:var(--tint);padding:24px;">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;">
              <div>
                <b style="font-size:16px;color:var(--navy);display:block;">Download Module 1 Complete Notes</b>
                <p class="sm" style="margin:4px 0 0;">Export all syllabus concepts, definitions, commands, and video references into an offline plain text (.txt) file.</p>
              </div>
              <button type="button" class="btn" data-a="dlTxt" style="display:inline-flex;align-items:center;gap:8px;font-size:14px;padding:12px 22px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="7 10 12 15 17 10"></polyline>
                  <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                <span>Download Notes (.txt)</span>
              </button>
            </div>
          </div>

          <!-- Comprehensive Summary Cards for all 8 Levels -->
          <div style="display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:30px;">
            ${LEVELS.map((l, idx) => `
              <div class="card" style="padding:18px 22px;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px;">
                  <span class="lab" style="color:var(--blue);font-size:13px;font-weight:800;">Level ${idx + 1}: ${esc(l.title.replace(/^\d+\.\s*/, ''))}</span>
                  <button type="button" class="btn alt" data-a="tab" data-i="${idx}" style="padding:4px 12px;font-size:12px;">Jump to Level ${idx + 1}</button>
                </div>
                <p class="sm" style="margin-bottom:12px;color:var(--navy);font-weight:600;">${esc(l.desc)}</p>

                <div style="background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:12px;">
                  <span class="lab">Core Facts &amp; Technical Concepts:</span>
                  <ul style="margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.5;color:var(--navy);">
                    ${l.facts.map(f => `<li style="margin-bottom:4px;"><b>${esc(f[0])}:</b> ${esc(f[1])}</li>`).join("")}
                  </ul>
                </div>



                ${l.video ? `
                  <div style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:12.5px;">
                    <b>Video Guide:</b> <a href="${esc(l.video.url)}" target="_blank" rel="noopener noreferrer" style="color:var(--blue);text-decoration:none;font-weight:700;">${esc(l.video.title)} (${esc(l.video.channel)}) &rarr;</a>
                  </div>
                ` : ''}
              </div>
            `).join("")}
          </div>

          <!-- Bottom Navigation -->
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:28px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap;gap:12px;">
            <button type="button" class="btn alt" data-a="tab" data-i="7">&larr; Back to Level 8</button>
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
              <button type="button" class="btn alt" data-a="tab" data-i="0">Restart Module 1</button>
              <a href="Module2.html" class="btn" style="text-decoration:none;display:inline-flex;align-items:center;">Proceed to Module 2 &rarr;</a>
            </div>
          </div>
        `;
      }

      /* Flowchart View Switcher */
      function switchFlowchartMode(modeIdx) {
        activeFcMode = modeIdx;
        const fc = FLOWCHARTS[currentTab] || FLOWCHARTS[0];
        const chips = $("fc_chips").querySelectorAll(".chip");
        chips.forEach((c, i) => c.classList.toggle("on", i === modeIdx));
        $("fc_chart_wrap").innerHTML = fc.views[modeIdx];
        $("fc_explain").innerHTML = `<p style="margin:0;font-size:13.5px;color:var(--navy);line-height:1.5;">${esc(fc.explains[modeIdx])}</p>`;
      }

      /* Chips Picker */
      function pickChip(i) {
        const l = LEVELS[currentTab];
        if (!l) return;
        const items = $("chips").children;
        for (let k = 0; k < items.length; k++)
          items[k].classList.toggle("on", k === i);
        const it = l.facts[i];
        $("chipDetail").innerHTML =
          `<p><b style="color:var(--navy);font-size:14px;">${esc(it[0])}</b></p><p style="margin-top:3px;font-size:13.5px;">${esc(it[1])}</p>`;
      }

      /* Generate Complete Course Notes Plain Text (.txt) */
      function generateSummaryText() {
        let txt = "";
        txt += "================================================================================\n";
        txt += "INOVATE SOLUTION TECHNOLOGY (IST LEARN)\n";
        txt += "MODULE 1: LINUX ADMINISTRATION & FUNDAMENTALS — COURSE SUMMARY NOTES\n";
        txt += "================================================================================\n\n";

        LEVELS.forEach((l, idx) => {
          txt += `LEVEL ${idx + 1}: ${l.title.toUpperCase()}\n`;
          txt += "--------------------------------------------------------------------------------\n";
          txt += `Overview: ${l.desc}\n\n`;
          txt += "Key Technical Concepts & Student Takeaways:\n";
          l.facts.forEach(f => {
            txt += `  • ${f[0]}: ${f[1]}\n`;
          });
          if (l.video) {
            txt += "\nPractical Video Demonstration Guide:\n";
            txt += `  • Title: ${l.video.title}\n`;
            txt += `  • Channel: ${l.video.channel}\n`;
            txt += `  • Link: ${l.video.url}\n`;
          }
          txt += "\n\n";
        });

        txt += "================================================================================\n";
        txt += "Official Website: https://www.inovatesolutiontechnology.in/\n";
        txt += "Inovate Solution Technology — Empowering Real-world Engineering Mastery\n";
        txt += "================================================================================\n";
        return txt;
      }

      /* Trigger Browser Download for .txt file */
      function downloadCourseSummaryTxt() {
        const textContent = generateSummaryText();
        const blob = new Blob([textContent], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "Linux_Module1_Course_Summary.txt";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      /* Centralized Event Handler */
      document.addEventListener("click", (e) => {
        const t = e.target.closest("[data-a]");
        if (!t) return;
        const a = t.dataset.a;
        const i = +t.dataset.i;

        if (a === "tab") {
          renderActiveTab(i);
          window.scrollTo({ top: 0, behavior: "smooth" });
        } else if (a === "chip") {
          pickChip(i);
        } else if (a === "archLvl") {
          selectArchLayer(t.dataset.l);
        } else if (a === "formulaPart") {
          selectFormulaPart(t.dataset.p);
        } else if (a === "fcMode") {
          switchFlowchartMode(+t.dataset.m);
        } else if (a === "dlTxt") {
          downloadCourseSummaryTxt();
        }
      });

      /* Initialize Level 1 */
      renderActiveTab(0);
    </script>
  </body>
</html>
